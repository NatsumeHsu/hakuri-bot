<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入 · 白璃管理後台</title><link rel="stylesheet" href="/admin.css"><script src="/login.js" defer></script></head>
<body style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#1e3028"><div class="panel" style="width:100%;max-width:420px;padding:38px"><div class="eyebrow">HAKURI / CONTROL</div><h1>歡迎回來。</h1><p style="color:var(--muted);margin-bottom:28px">登入白璃管理後台，讓對話保持連結。</p><p id="login-notice" role="alert" hidden></p><form action="/login" method="post" id="login-form"><label for="username">管理員帳號</label><input id="username" name="username" autocomplete="username" value="admin" required><label for="password" style="margin-top:18px">密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required><input type="hidden" name="_csrf" id="csrf"><button id="login-button" class="primary" style="width:100%;margin-top:26px" disabled>正在準備登入…</button></form><small style="display:block;color:var(--muted);margin-top:24px">新資料庫的預設帳號／密碼皆為 admin；已有密碼會保留。可在後台「登入安全」修改密碼。</small></div></body></html>
